services:
  postgres:
    image: postgres:16-alpine
    container_name: nara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nara_user
      POSTGRES_PASSWORD: nara_password
      POSTGRES_DB: nara_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
